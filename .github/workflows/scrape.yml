name: Daily Lead Scraper

on:
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC = 10:00 Budapest (CEST) / 09:00 (CET)
  workflow_dispatch:        # allow manual trigger from GitHub Actions UI

permissions:
  contents: write           # needed to push CSV files back to the repo

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lead-system/requirements.txt

      - name: Install dependencies
        run: pip install -r lead-system/requirements.txt

      - name: Install Playwright browser
        run: playwright install chromium --with-deps

      - name: Run scraper
        working-directory: lead-system/scripts
        run: python run_scraper.py --source all --pages 5

      - name: Commit and push new lead files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the raw_leads directory
          git add lead-system/raw_leads/

          # Only commit if there is something new
          if git diff --cached --quiet; then
            echo "No new lead files to commit."
          else
            DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: daily lead scrape – ${DATE}"
            git push origin HEAD
          fi
